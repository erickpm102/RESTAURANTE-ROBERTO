:root{--bg:#f6f4ef;--sf:#fff;--tx:#1e1e1e;--mu:#6b6b6b;--ac:#b4472b;--ok:#2e9d57;--rd:#d32f2f;--bd:#ddd8cc;--f1:#ecdfc6;--f2:#e4d5b8;--g1:#d3ebcb;--g2:#c2e1b8;--zt:#4a3a22;--bz:#e8dcc9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.g{background:var(--ok);border-color:var(--ok);color:#fff}
input,select{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}

.salon{background:repeating-linear-gradient(90deg,var(--f1) 0 46px,var(--f2) 46px 48px)}.terr{background:radial-gradient(circle at 20% 20%,var(--g1),var(--g2))}.barz{background:var(--bz)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}.tb img{display:block;margin:0 auto;max-width:100%;height:auto;transition:filter .2s}.tb img.fr{filter:drop-shadow(0 0 3px #2e9d57) drop-shadow(0 0 1px #2e9d57)}.tb img.oc{filter:drop-shadow(0 0 4px #d32f2f) drop-shadow(0 0 2px #d32f2f)}.tb .lb{display:block;font-size:13px;font-weight:800;margin-top:2px}.tb small.o{color:#ff5c5c}.tb small.f{color:#35b36b}.tb.bt2{padding:0}.bsvg g.st{cursor:pointer}.bsvg g.st:hover circle{stroke:#fff;stroke-width:2}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ===== NEO / FUTURISTA ===== */

table{border-collapse:separate;border-spacing:0}

td,th{border-bottom:1px solid #1a2540;padding:8px 6px}

var DEN=[[50000,"Billete"],[20000,"Billete"],[10000,"Billete"],[5000,"Billete"],[2000,"Billete"],[1000,"Billete"],[500,"Moneda"],[100,"Moneda"],[50,"Moneda"],[25,"Moneda"],[10,"Moneda"]];
function dnTot(d){const o=(V.dn||{})[d]||{};return DEN.reduce((s,[v])=>s+v*(+o[v]||0),0)}
function dnU(d,v,q){V.dn=V.dn||{};const o=V.dn[d]||(V.dn[d]={});o[v]=Math.max(0,Math.floor(+q||0));const e=$("#dns"+v);if(e)e.textContent=f(v*o[v]);const t=$("#dnT");if(t)t.textContent=f(dnTot(d));const c=$("#ce");if(c){c.value=dnTot(d);cqU()}}
function dnH(d,lk){const ttl="<h2>Conteo de efectivo</h2>";
if(lk)return lk.dn?ttl+`<div class="card"><div class="wrap"><table><tr><th></th><th>Denominación</th><th>Cantidad</th><th>Subtotal</th></tr>${DEN.filter(([v])=>lk.dn[v]>0).map(([v,t])=>`<tr><td>${t}</td><td>${f(v)}</td><td>${lk.dn[v]}</td><td>${f(v*lk.dn[v])}</td></tr>`).join("")}<tr><th colspan="3">Total efectivo contado</th><th>${f(DEN.reduce((s,[v])=>s+v*(lk.dn[v]||0),0))}</th></tr></table></div></div>`:"";
const o=(V.dn||{})[d]||{};
return ttl+`<div class="card"><p style="margin:0 0 6px;color:var(--mu)">Escriba cuántos billetes y monedas tiene de cada denominación. El total pasa solo al campo "Efectivo total" del cuadre.</p><div class="wrap"><table><tr><th></th><th>Denominación</th><th>Cantidad</th><th>Subtotal</th></tr>${DEN.map(([v,t])=>`<tr><td>${t}</td><td>${f(v)}</td><td><input type="number" min="0" inputmode="numeric" style="width:90px" value="${o[v]||""}" oninput="dnU('${d}',${v},this.value)"></td><td id="dns${v}">${f(v*(o[v]||0))}</td></tr>`).join("")}<tr><th colspan="3">Total efectivo contado</th><th id="dnT">${f(dnTot(d))}</th></tr></table></div></div>`}

function phRes(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const W=240,H=180,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d"),r=Math.max(W/i.width,H/i.height),w=i.width*r,h=i.height*r;x.drawImage(i,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.65))};i.onerror=()=>{URL.revokeObjectURL(u);no()};i.src=u})}
